embed-optim-bridge-dense-no-packing = "embed_optim.corrected_retrieval_bridge:main"
embed-optim-sensitivity-dense-no-packing = "embed_optim.corrected_execution_sensitivity:main"
embed-optim-render-dense-no-packing = "embed_optim.corrected_publication:main"
