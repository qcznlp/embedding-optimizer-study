override-dependencies = [
  "fast-plaid==1.6.0.290",
  "sentence-transformers==5.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["scripts/pretrain", "scripts/finetune"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
