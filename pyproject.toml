[project.urls]
Repository = "https://github.com/qcznlp/embedding-optimizer-study"
Documentation = "https://github.com/qcznlp/embedding-optimizer-study#readme"
Issues = "https://github.com/qcznlp/embedding-optimizer-study/issues"
StudyPaper = "https://github.com/qcznlp/embedding-optimizer-study/blob/main/paper/main.tex"
DenseOnPaper = "https://arxiv.org/abs/2607.27178"
Muon = "https://kellerjordan.github.io/posts/muon/"
DenseModel = "https://huggingface.co/lightonai/DenseOn-unsupervised"
NorMuon = "https://github.com/zichongli5/NorMuon"

[build-system]
