# This build configuration substantially modifies lightonai/mdenseon-mlateon at commit
# b0db47a48f969d825446668b5b17bfc27a359fc1; see THIRD_PARTY_NOTICES.md.
[project]
name = "embedding-optimizer-study"
version = "0.1.0"
description = "Reproducible AdamW, Muon, and NorMuon experiments for dense retriever adaptation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [
  { name = "Qingcheng Zeng", email = "stevezenguom@gmail.com" },
  { name = "LightOn", email = "contact@lighton.ai" },
]
dependencies = [
  "accelerate>=1.10,<2",
  "datasets>=4.8,<5",
  "huggingface-hub>=1.2,<2",
  "late-interaction-kernels>=0.4,<0.5",
  "numpy>=2,<3",
  "pyarrow>=22,<24",
  "pylate==1.6.0",
  "pyyaml>=6,<7",
  "safetensors>=0.6,<1",
  "sentence-transformers>=5.3,<6",
  "torch>=2.9,<2.10",
  "tqdm>=4.67,<5",
  "transformers==5.3.0",
  "wandb>=0.24,<1",
]

[project.optional-dependencies]
dev = [
  "cffconvert==2.0.0",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
eval = [
  "fast-plaid==1.6.0.290",
  "mteb>=2.18,<3",
  "usearch>=2.19,<3",
]
analysis = [
  "matplotlib>=3.10,<4",
  "pandas>=2.3,<4",
]
flash = ["flash-attn==2.7.4.post1"]

[project.scripts]
embed-optim-prepare = "embed_optim.data:main"
embed-optim-prepare-dense-no-packing-preflight = "embed_optim.dense_no_packing_preflight:main"
embed-optim-validate-dense-no-packing = "embed_optim.corrected_validation_matrix:main"
embed-optim-evaluate-dense-no-packing = "embed_optim.corrected_beir_evaluation:main"
embed-optim-dense-no-packing-progress = "embed_optim.corrected_progress:main"
embed-optim-backup-dense-no-packing = "embed_optim.corrected_checkpoint_backup:main"
embed-optim-backup-sealed-checkpoint = "embed_optim.incremental_checkpoint_backup:main"
embed-optim-supervise-sealed-checkpoint-backup = "embed_optim.sealed_checkpoint_supervisor:main"
embed-optim-analyze-dense-no-packing-geometry = "embed_optim.corrected_geometry_matrix:main"
