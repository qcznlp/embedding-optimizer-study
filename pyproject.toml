[project]
name = "embedding-optimizer-study"
version = "0.1.0"
description = "Reproducible AdamW, Muon, and NorMuon experiments for dense and late-interaction retrievers"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [
  { name = "Qingcheng Zeng", email = "stevezenguom@gmail.com" },
  { name = "LightOn", email = "contact@lighton.ai" },
]
dependencies = [
  "accelerate>=1.10,<2",
  "datasets>=4.8,<5",
  "huggingface-hub>=1.2,<2",
  "late-interaction-kernels>=0.4,<0.5",
  "numpy>=2,<3",
  "pyarrow>=22,<24",
  "pylate==1.6.0",
  "pyyaml>=6,<7",
  "safetensors>=0.6,<1",
  "sentence-transformers>=5.3,<6",
  "torch>=2.9,<2.10",
  "tqdm>=4.67,<5",
  "transformers==5.3.0",
  "wandb>=0.24,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
eval = [
  "fast-plaid==1.6.0.290",
  "mteb>=2.18,<3",
  "usearch>=2.19,<3",
]
analysis = [
  "matplotlib>=3.10,<4",
  "pandas>=2.3,<4",
]
flash = ["flash-attn==2.7.4.post1"]

[project.scripts]
embed-optim-prepare = "embed_optim.data:main"
embed-optim-prepare-probe = "embed_optim.probes:main"
embed-optim-prepare-beir-probe = "embed_optim.beir_probe:main"
embed-optim-prepare-validation = "embed_optim.validation_data:main"
embed-optim-prepare-confirmatory-data = "embed_optim.confirmatory_data:main"
embed-optim-generate-confirmatory-matrices = "embed_optim.confirmatory_matrix:main"
embed-optim-evaluate-confirmatory = "embed_optim.confirmatory_evaluation:main"
embed-optim-summarize-confirmatory = "embed_optim.confirmatory_summary:main"
embed-optim-short-branch = "embed_optim.short_branch:main"
embed-optim-short-branch-evaluate = "embed_optim.short_branch_evaluation:main"
embed-optim-summarize-short-branch = "embed_optim.short_branch_summary:main"
embed-optim-audit-paper = "embed_optim.paper_audit:main"
embed-optim-summarize-training = "embed_optim.training_dynamics:main"
embed-optim-plot-training = "embed_optim.training_dynamics_plot:main"
embed-optim-summarize-retrieval-dynamics = "embed_optim.retrieval_dynamics:main"
embed-optim-validation-matrix = "embed_optim.validation_matrix:main"
embed-optim-summarize-validation = "embed_optim.validation_summary:main"
embed-optim-export-probe = "embed_optim.probe_export:main"
embed-optim-export-gradients = "embed_optim.gradient_probe:main"
embed-optim-common-state-matrix = "embed_optim.common_state_matrix:main"
embed-optim-common-state-spectra = "embed_optim.common_state_spectra:main"
embed-optim-plot-common-state-spectra = "embed_optim.common_state_spectrum_plot:main"
embed-optim-summarize-common-state = "embed_optim.common_state_summary:main"
embed-optim-functional-intervention = "embed_optim.functional_intervention:main"
embed-optim-functional-intervention-matrix = "embed_optim.functional_intervention_matrix:main"
embed-optim-summarize-functional-interventions = "embed_optim.functional_intervention_summary:main"
embed-optim-probe-matrix = "embed_optim.probe_matrix:main"
embed-optim-summarize-probes = "embed_optim.representation_summary:main"
embed-optim-plot-representation-dynamics = "embed_optim.representation_plot:main"
embed-optim-plot-late-token-dynamics = "embed_optim.representation_plot:late_main"
embed-optim-build-mechanism-bridge = "embed_optim.mechanism_bridge:main"
embed-optim-render-mechanism-report = "embed_optim.mechanism_report:main"
embed-optim-render-outcome-report = "embed_optim.outcome_report:main"
embed-optim-summarize-hybrid-control = "embed_optim.hybrid_control:main"
embed-optim-train = "embed_optim.train:main"
embed-optim-matrix = "embed_optim.matrix:main"
embed-optim-evaluate = "embed_optim.evaluate_matrix:main"
embed-optim-evaluation-progress = "embed_optim.evaluation_progress:main"
embed-optim-supervise-evaluation = "embed_optim.evaluation_supervisor:main"
embed-optim-post-eval-pipeline = "embed_optim.post_eval_pipeline:main"
embed-optim-aggregate = "embed_optim.aggregate:main"
embed-optim-sync-wandb = "embed_optim.wandb_sync:main"
embed-optim-watch-checkpoints = "embed_optim.checkpoint_watch:main"
embed-optim-supervise = "embed_optim.supervisor:main"
embed-optim-verify-runtime = "embed_optim.runtime:main"
embed-optim-geometry = "embed_optim.geometry:main"
embed-optim-summarize-geometry = "embed_optim.geometry_summary:main"
embed-optim-plot-geometry = "embed_optim.geometry_plot:main"
embed-optim-plot-geometry-phase = "embed_optim.geometry_plot:phase_main"
embed-optim-analyze-probe = "embed_optim.representation_geometry:main"
embed-optim-analyze-updates = "embed_optim.update_geometry:main"

[project.urls]
Paper = "https://arxiv.org/abs/2607.27178"
Muon = "https://kellerjordan.github.io/posts/muon/"
DenseModel = "https://huggingface.co/lightonai/DenseOn-unsupervised"
LateModel = "https://huggingface.co/lightonai/LateOn-unsupervised"
NorMuon = "https://github.com/zichongli5/NorMuon"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/embedding-optimizer-study/configs" = [
  "configs/beir_representation_probe.json",
  "configs/experiment.yaml",
  "configs/common_state_probe.json",
  "configs/common_state_spectrum_probe.json",
  "configs/confirmatory_protocol.json",
  "configs/functional_intervention.json",
  "configs/formal_runtime.json",
  "configs/hybrid_adamw_control.json",
  "configs/hybrid_adamw.yaml",
  "configs/paper_claim_protocol.json",
  "configs/representation_probe.json",
  "configs/retrieval_dynamics_protocol.json",
  "configs/short_branch_protocol.json",
  "configs/smoke.yaml",
  "configs/stress.yaml",
  "configs/training_data_contract.json",
  "configs/validation_probe.json",
]
"share/embedding-optimizer-study/scripts/eval" = [
  "scripts/eval/dense_parallel.py",
  "scripts/eval/dense_sequential.py",
  "scripts/eval/late_interaction.py",
]
"share/doc/embedding-optimizer-study" = [
  "CITATION.cff",
  "CONTRIBUTING.md",
  "THIRD_PARTY_NOTICES.md",
]
"share/doc/embedding-optimizer-study/docs" = [
  "docs/blog.md",
  "docs/completion-gates.md",
  "docs/naacl-paper-plan.md",
]
"share/doc/embedding-optimizer-study/reports/weight-space" = [
  "reports/weight-space/README.md",
  "reports/weight-space/checkpoint_trajectory.csv",
  "reports/weight-space/optimizer_geometry_phase.svg",
  "reports/weight-space/optimizer_pair_contrasts.csv",
  "reports/weight-space/optimizer_pair_contrast_trajectory.csv",
  "reports/weight-space/optimizer_pair_contrast_trajectory.svg",
  "reports/weight-space/run_trajectory_summary.csv",
  "reports/weight-space/summary_manifest.json",
]
"share/doc/embedding-optimizer-study/reports/training-dynamics" = [
  "reports/training-dynamics/optimizer_system_summary.csv",
  "reports/training-dynamics/plot_manifest.json",
  "reports/training-dynamics/run_summary.csv",
  "reports/training-dynamics/stage_dynamics.csv",
  "reports/training-dynamics/summary_manifest.json",
  "reports/training-dynamics/system_tradeoffs.svg",
  "reports/training-dynamics/training_loss_dynamics.svg",
]
"share/doc/embedding-optimizer-study/reports/confirmatory-data" = [
  "reports/confirmatory-data/receipt.json",
]
"share/doc/embedding-optimizer-study/reports/short-branch" = [
  "reports/short-branch/subset-receipt.json",
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
override-dependencies = [
  "fast-plaid==1.6.0.290",
  "sentence-transformers==5.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["scripts/pretrain", "scripts/finetune"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
