name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra eval --extra analysis
      - name: Install document and CPU replay build tools
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended poppler-utils build-essential pkg-config libssl-dev zlib1g-dev libbz2-dev libffi-dev libsqlite3-dev liblzma-dev
      - name: Validate citation metadata
        run: uv run cffconvert --validate --infile CITATION.cff
      - name: Audit formal CUDA 12.9 reconstruction locks
        run: |
          uv pip install --python .venv/bin/python --no-config --require-hashes --torch-backend cu129 --overrides requirements-formal.lock --dry-run -r requirements-formal.lock
          uv pip install --python .venv/bin/python --no-config --no-deps --require-hashes --no-build-isolation-package flash-attn --dry-run -r requirements-formal-flash.txt
      - name: Install the actual hash-locked scientific runtime
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          uv pip install --python .venv/bin/python --no-config --require-hashes --torch-backend cu129 --overrides requirements-formal.lock -r requirements-formal.lock
          uv pip install --python .venv/bin/python --no-config --no-deps --require-hashes -r requirements-ci-flash-wheel.txt
          uv pip install --python .venv/bin/python --no-config --no-deps --require-hashes -r requirements-primary-replay.txt
          .venv/bin/python -c 'import torch; import flash_attn_2_cuda; assert torch.version.cuda == "12.9"; assert torch._C._GLIBCXX_USE_CXX11_ABI; assert all(callable(getattr(flash_attn_2_cuda, n)) for n in ("fwd", "varlen_fwd", "bwd", "varlen_bwd", "fwd_kvcache"))'
          .venv/bin/python -m embed_optim.runtime --spec configs/formal_runtime.json
      - name: Verify all twelve actual primary source identities
        run: uv run --no-sync python -m pytest -q tests/test_current_primary_source.py
      - run: uv build
      - run: uv run --no-sync embed-optim-audit-distribution
      - name: Audit portable paper evidence closure
        run: uv run --no-sync python scripts/portable_evidence.py --audit-only
      - name: Prepare authenticated CPU instruction emulation
        run: |
          mkdir "$RUNNER_TEMP/sde-runtime" "$RUNNER_TEMP/cpu-replay-diagnostics"
          curl --fail --location --retry 2 https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz --output "$RUNNER_TEMP/sde-runtime/intel-sde.tar.xz"
          printf '94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  %s\n' "$RUNNER_TEMP/sde-runtime/intel-sde.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sde-runtime/intel-sde.tar.xz" --directory "$RUNNER_TEMP/sde-runtime"
          lscpu > "$RUNNER_TEMP/cpu-replay-diagnostics/host-cpu.txt"
      - name: Build the original-source CPU replay interpreter
        run: >-
          .venv/bin/python -B scripts/build_ci_python.py
          --output "$RUNNER_TEMP/cpu-python-runtime"
          --packages-directory "$GITHUB_WORKSPACE/.venv/lib/python3.12/site-packages"
          --jobs 4
      - name: Verify subprocess isolation under CPU emulation
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          "$RUNNER_TEMP/sde-runtime/sde-external-10.13.1-2026-07-28-lin/sde64"
          -skx -force_emulate skx --
          "$RUNNER_TEMP/cpu-python-runtime/install/bin/python3.12" -B
          scripts/check_cpu_replay_fds.py > "$RUNNER_TEMP/cpu-replay-diagnostics/fd-isolation.log" 2>&1
      - name: Verify original functional decisions under CPU emulation
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_CORETYPE: SkylakeX
        run: |
          "$RUNNER_TEMP/sde-runtime/sde-external-10.13.1-2026-07-28-lin/sde64" -skx -force_emulate skx -- "$RUNNER_TEMP/cpu-python-runtime/install/bin/python3.12" -B reports/engineering-archive/dense-v3-ci-functional-diagnostic-v1/inspect_functional.py "$GITHUB_WORKSPACE/reports/engineering-archive/dense-v3-complete-replay-entry-v1/closed/primary" "$RUNNER_TEMP/cpu-replay-diagnostics/functional.json" > "$RUNNER_TEMP/cpu-replay-diagnostics/runtime.log" 2>&1
          .venv/bin/python -c 'import json, os; from pathlib import Path; r=json.loads((Path(os.environ["RUNNER_TEMP"])/"cpu-replay-diagnostics/functional.json").read_text()); assert r["functional_tables_exact"] is True and r["decisions_exact"] is True and r["differences"] == [] and r["acceptance_override"] is False'
      - name: Reproduce complete numerical findings and reviewed paper
        id: numerical
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONPATH: "${{ github.workspace }}/src:${{ github.workspace }}"
          PYTHONDONTWRITEBYTECODE: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_CORETYPE: SkylakeX
        run: >-
          make -C paper release
          PYTHON="$RUNNER_TEMP/sde-runtime/sde-external-10.13.1-2026-07-28-lin/sde64 -skx -force_emulate skx -- $RUNNER_TEMP/cpu-python-runtime/install/bin/python3.12"
          NUMERICAL_BUNDLE="$GITHUB_WORKSPACE/reports/engineering-archive/dense-v3-complete-replay-entry-v1/closed"
          RELEASE_OUTPUT="$RUNNER_TEMP/complete-paper"
      - name: Capture original functional diagnostics after replay failure
        if: failure() && steps.numerical.outcome == 'failure'
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/complete-paper/diagnostics"
          lscpu > "$RUNNER_TEMP/complete-paper/diagnostics/cpu.txt"
          .venv/bin/python -B reports/engineering-archive/dense-v3-ci-functional-diagnostic-v1/inspect_functional.py "$GITHUB_WORKSPACE/reports/engineering-archive/dense-v3-complete-replay-entry-v1/closed/primary" "$RUNNER_TEMP/complete-paper/diagnostics/functional.json" > "$RUNNER_TEMP/complete-paper/diagnostics/runtime.log" 2>&1
      - name: Run every test in its explicit source version
        run: uv run --no-sync python scripts/test_source_roles.py --output "$RUNNER_TEMP/source-role-tests"
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - name: Retain actual test and document receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipts
          path: |
            ${{ runner.temp }}/source-role-tests/*.json
            ${{ runner.temp }}/source-role-tests/*.xml
            ${{ runner.temp }}/source-role-tests/*.log
            ${{ runner.temp }}/complete-paper/
            ${{ runner.temp }}/cpu-replay-diagnostics/
            ${{ runner.temp }}/cpu-python-runtime/*.json
            ${{ runner.temp }}/cpu-python-runtime/*.log
