name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra eval --extra analysis
      - name: Install document build tools
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Validate citation metadata
        run: uv run cffconvert --validate --infile CITATION.cff
      - name: Audit formal CUDA 12.9 reconstruction locks
        run: |
          uv pip install --python .venv/bin/python --no-config --require-hashes --torch-backend cu129 --overrides requirements-formal.lock --dry-run -r requirements-formal.lock
          uv pip install --python .venv/bin/python --no-config --no-deps --require-hashes --no-build-isolation-package flash-attn --dry-run -r requirements-formal-flash.txt
      - name: Install CUDA compiler for the genuine pinned FlashAttention build
        run: |
          curl --fail --location --output "$RUNNER_TEMP/cuda-keyring.deb" https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-12-9 cuda-cudart-dev-12-9
      - name: Install the actual hash-locked scientific runtime
        env:
          CUDA_HOME: /usr/local/cuda-12.9
          FLASH_ATTENTION_FORCE_BUILD: "TRUE"
          FLASH_ATTN_CUDA_ARCHS: "80;90"
          MAX_JOBS: "2"
          NVCC_THREADS: "1"
        run: |
          uv pip install --python .venv/bin/python --no-config --require-hashes --torch-backend cu129 --overrides requirements-formal.lock -r requirements-formal.lock
          uv pip install --python .venv/bin/python --no-config --no-deps --require-hashes --no-build-isolation-package flash-attn -r requirements-formal-flash.txt
          .venv/bin/python -c 'import torch; import flash_attn_2_cuda; assert torch.version.cuda == "12.9"'
          .venv/bin/python -m embed_optim.runtime --spec configs/formal_runtime.json
      - run: uv build
      - run: uv run --no-sync embed-optim-audit-distribution
      - name: Audit portable paper evidence closure
        run: uv run --no-sync python scripts/portable_evidence.py --audit-only
      - name: Run every test in its explicit source version
        run: uv run --no-sync python scripts/test_source_roles.py --output "$RUNNER_TEMP/source-role-tests"
      - name: Reproduce complete numerical findings and reviewed paper
        run: >-
          make -C paper release PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          NUMERICAL_BUNDLE="$GITHUB_WORKSPACE/reports/engineering-archive/dense-v3-complete-replay-entry-v1/closed"
          RELEASE_OUTPUT="$RUNNER_TEMP/complete-paper"
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - name: Retain actual test and document receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipts
          path: |
            ${{ runner.temp }}/source-role-tests/*.json
            ${{ runner.temp }}/source-role-tests/*.xml
            ${{ runner.temp }}/source-role-tests/*.log
            ${{ runner.temp }}/complete-paper/complete.json
            ${{ runner.temp }}/complete-paper/reviewed/paper/build/main.pdf
