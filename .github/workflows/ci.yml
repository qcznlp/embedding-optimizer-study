name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra eval --extra analysis
      - run: uv build
      - run: uv run embed-optim-audit-distribution
      - run: uv run pytest
      - run: uv run ruff check src tests scripts/eval
      - run: uv run ruff format --check src tests scripts/eval
